<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>iVision Knowledge Hub · Guest demo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="live-config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><a href="./"><strong>ivision</strong> Knowledge Hub</a><span>Synthetic guest demo</span></header>
  <main>
    <h1>Explore project knowledge</h1>
    <p class="intro">Search sample emails, follow project activity, and read the original synthetic source text.</p>
    <div class="workspace">
      <aside aria-label="Browse">
        <p id="operator-link" hidden><a>Review &amp; Approve</a></p>
        <button id="timeline" type="button" aria-pressed="false">Project timeline</button>
        <h2>Topics</h2>
        <div id="topics"></div>
      </aside>
      <section aria-labelledby="view-title">
        <form id="search">
          <input id="query" type="search" maxlength="300" aria-label="Search emails" placeholder="Ask for updates or search by keyword" autocomplete="off">
          <button type="submit">Search</button>
        </form>
        <label for="project">Project</label>
        <select id="project"><option value="">All projects</option></select>
        <h2 id="view-title">Sources</h2>
        <p id="summary" role="status">Loading synthetic sources…</p>
        <div id="results"></div>
        <nav aria-label="Result pages">
          <button id="prev" type="button" disabled>Previous</button>
          <button id="next" type="button" disabled>Next</button>
        </nav>
      </section>
    </div>
  </main>
  <noscript>Enable JavaScript to browse this demo.</noscript>
</body>
</html>
